name: Scheduled carousel
on:
  schedule:
    - cron: '30 1,4,7,10,13,16 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate privately without publishing'
        type: boolean
        default: true
      mock_apis:
        description: 'Use offline fixtures (requires dry run)'
        type: boolean
        default: true
      slot_hour:
        description: 'Optional IST slot hour for testing (7,9,...,21)'
        type: string
        default: ''
env:
  STATE_BRANCH: ${{ github.event.repository.default_branch }}
concurrency:
  group: instagram-state
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      staged: ${{ steps.result.outputs.staged }}
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      MOCK_APIS: ${{ github.event_name == 'workflow_dispatch' && inputs.mock_apis || false }}
      SLOT_HOUR: ${{ inputs.slot_hour }}
      PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
      AZURE_OPENAI_IMAGE_API_KEY_1: ${{ secrets.AZURE_OPENAI_IMAGE_API_KEY_1 }}
      AZURE_OPENAI_IMAGE_API_VERSION_1: ${{ secrets.AZURE_OPENAI_IMAGE_API_VERSION_1 }}
      AZURE_OPENAI_IMAGE_ENDPOINT_1: ${{ secrets.AZURE_OPENAI_IMAGE_ENDPOINT_1 }}
      AZURE_OPENAI_IMAGE_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_IMAGE_DEPLOYMENT }}
      GUARDIAN_KEY: ${{ secrets.GUARDIAN_KEY }}
      GNEWS_KEY: ${{ secrets.GNEWS_KEY }}
      NASA_KEY: ${{ secrets.NASA_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      FB_APP_ID: ${{ secrets.FB_APP_ID }}
      FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
      GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node scripts/jitter.js
        if: github.event_name == 'schedule'
      - run: |
          git config user.name 'carousel-bot'
          git config user.email 'carousel-bot@users.noreply.github.com'
      - run: npm test
      - run: node src/main.js
      - id: result
        run: |
          if [ -f output/pending.json ]; then echo 'staged=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-run-output
          path: output/
          retention-days: 2
          if-no-files-found: ignore
      - run: node scripts/build-pages.js
        if: steps.result.outputs.staged == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.result.outputs.staged == 'true'
        with:
          path: .pages-build
  deploy:
    needs: prepare
    if: needs.prepare.outputs.staged == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  publish:
    needs: [prepare, deploy]
    if: needs.prepare.outputs.staged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      FB_APP_ID: ${{ secrets.FB_APP_ID }}
      FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
      GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: private-run-output
          path: output
      - run: |
          git config user.name 'carousel-bot'
          git config user.email 'carousel-bot@users.noreply.github.com'
      - run: node src/main.js finish
  refresh-dashboard:
    needs: [prepare, deploy, publish]
    if: always() && needs.prepare.outputs.staged == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/build-pages.js
      - uses: actions/upload-pages-artifact@v3
        with:
          name: dashboard-pages
          path: .pages-build
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: dashboard-pages
  alert:
    needs: [prepare, deploy, publish, refresh-dashboard]
    if: always() && contains(needs.*.result, 'failure') && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --input-type=module -e "import {alert} from './src/alert.js'; await alert('Carousel workflow failed. Inspect the Actions run; reserved stories will not be retried automatically.');"
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
