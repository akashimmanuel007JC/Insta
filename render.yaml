services:
  - type: web
    name: youth-group-polls
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT --access-logfile -
    healthCheckPath: /healthz
    envVars:
      - key: GITHUB_DATA_TOKEN
        sync: false
      - key: GITHUB_DATA_KEY
        sync: false
