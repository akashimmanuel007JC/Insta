services:
  - type: web
    name: youth-group-polls
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT --access-logfile -
    healthCheckPath: /healthz
    disk:
      name: poll-data
      mountPath: /var/data
      sizeGB: 1
